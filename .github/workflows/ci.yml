name: CI

on:
    push:
        branches: [main, claude/russian-docs-improvements-5iwtvl]
    pull_request:
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - run: bun install --frozen-lockfile

            - run: bun run lint

            - run: bun run format:check

            # Coverage is enabled by default in bunfig.toml, so this already reports it.
            - run: bun test
